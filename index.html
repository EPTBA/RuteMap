<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Winterdienst Routen 2026/2027</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
}

#map {
    width:100%;
    height:100vh;
    background:#ffffff;
}

/* OpenStreetMap-Basiskarte per CSS in Graustufen umwandeln */
.leaflet-tile-pane {
    filter: grayscale(1);
}

#legend {
    position: absolute;
    bottom: 20px;
    left: 10px;
    z-index: 1000;
    background: white;
    padding: 8px 10px;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 13px;
    line-height: 1.4;
    max-height: 60vh;
    overflow-y: auto;
    min-width: 190px;
    max-width: 280px;
}

#legend .legend-title {
    font-weight: bold;
    margin-bottom: 6px;
}

#legend .legend-item {
    display: flex;
    align-items: center;
    padding: 3px 4px;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
}

#legend .legend-item:hover {
    background: #f0f0f0;
}

#legend .legend-item.active {
    background: #e6f0ff;
    font-weight: bold;
}

#legend .swatch {
    display: inline-block;
    width: 16px;
    height: 5px;
    margin-right: 7px;
    border-radius: 2px;
    flex: 0 0 auto;
}

#legend .legend-item.all .swatch {
    background: linear-gradient(90deg,
        #e6194b, #3cb44b, #4363d8, #f58231);
}

/* Untermenü mit der Liste der Routen, eingerückt unter dem Bezirk */
#legend .route-list {
    margin: 2px 0 6px 20px;
    padding-left: 8px;
    border-left: 2px solid #ddd;
}

#legend .route-item {
    padding: 3px 4px;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#legend .route-item:hover {
    background: #f0f0f0;
}

#legend .route-item.active {
    background: #ffe6e6;
    font-weight: bold;
}

/* Schalter für die Routenbeschriftung */
#legend .label-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #e0e0e0;
    cursor: pointer;
    user-select: none;
}

#legend .label-toggle input {
    margin: 0;
    cursor: pointer;
}

/* Dauerhaft sichtbare Beschriftung direkt auf der Route */
.route-label {
    background: rgba(255,255,255,0.85);
    border: none;
    box-shadow: none;
    padding: 0 2px;
    font-size: 11px;
    font-weight: bold;
    color: #222;
    white-space: nowrap;
}

.route-label::before {
    display: none;
}

.route-label.selected {
    color: #c00;
    font-size: 12px;
}

/* Pannello di debug in basso a destra */
#apiDebug {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 1000;
    width: 380px;
    max-width: calc(100vw - 20px);
    max-height: 40vh;
    overflow: auto;
    background: rgba(255,255,255,0.96);
    border: 1px solid #cccccc;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-family: Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.4;
    padding: 8px 10px;
    color: #222222;
    white-space: pre-wrap;
    word-break: break-all;
}
#apiDebug .status-ok   { color: #1a7f37; font-weight: bold; }
#apiDebug .status-err  { color: #c62828; font-weight: bold; }
#apiDebug .label       { color: #666666; }
</style>

</head>
<body>

<div id="map"></div>

<div id="legend"></div>

<div id="apiDebug"><span class="label">API: noch keine Anfrage</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ==== Proxy Cloudflare ====
const PROXY_URL = 'https://sws-proxy.tuonome.workers.dev';
const NODE_PROPERTY = 'SN-Decentlab';

const debugBox = document.getElementById('apiDebug');

function logApi(html) {
    debugBox.innerHTML = html;
}

var map = L.map('map', {
    // Karte ist fixiert: kein Verschieben, kein Zoomen mit Mausrad/Doppelklick
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
    touchZoom: false,
    zoomControl: false,
    tap: false
}).setView([46.2, 8.8], 8);

// OpenStreetMap-Basiskarte, per CSS in Graustufen dargestellt
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let selectedLayer = null;
let geojsonLayer = null;
let allRoutesVisible = true;
let currentBezirk = 'all';

// Beschriftung der Routen ein-/ausschalten
let showRouteLabels = false;

// Strassenwetterstationen ein-/ausblenden (Standard: aus)
let showSws = false;
let swsLayer = null;

// 12 gut unterscheidbare Farben, eine pro Unterhaltsbezirk
const palette = [
    '#d62728', // Rot
    '#2ca02c', // Grün
    '#1f4fd8', // Blau
	'#8e44ad', // Violett
    '#ff8c00', // Orange
    '#0f9b8e', // Türkis
    '#e6199b', // Magenta
    '#8c5a1f', // Braun
    '#6b3fa0', // Dunkelviolett
    '#7a8c00', // Oliv
    '#00a3d9', // Hellblau
    '#b3005e'  // Bordeaux
];


const fallbackColor = '#3388ff';

// Bezirke, die am Ende der Liste erscheinen sollen
const bezirkeInFondo = ['UB 10', 'UB 12'];

// Zuordnung Bezirk -> Farbe, wird nach dem Laden der Daten gefüllt
const bezirkColors = {};

function colorForBezirk(bezirk) {
    return bezirkColors[bezirk] || fallbackColor;
}

// Beschriftungen aller Routen anhand des Schalters ein-/ausblenden
function updateRouteLabels() {

    if (!geojsonLayer) {
        return;
    }

    geojsonLayer.eachLayer(function(layer) {

        if (!layer._routeLabel) {
            return;
        }

        if (showRouteLabels && map.hasLayer(layer)) {
            layer._routeLabel.addTo(map);
        } else {
            map.removeLayer(layer._routeLabel);
        }

        // Beschriftung der ausgewählten Route hervorheben
        const el = layer._routeLabel.getElement();
        if (el) {
            el.classList.toggle('selected', layer === selectedLayer);
        }
    });
}

// --- Icona fiocco di neve blu chiaro su sfondo bianco, contorno grigio fine ---
const snowflakeSvg =
'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">' +
'<circle cx="12" cy="12" r="11" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>' +
'<g stroke="#5aa9e6" stroke-width="1.6" stroke-linecap="round" fill="none">' +
'<line x1="12" y1="5" x2="12" y2="19"/>' +
'<line x1="5.9" y1="8.5" x2="18.1" y2="15.5"/>' +
'<line x1="5.9" y1="15.5" x2="18.1" y2="8.5"/>' +
'<line x1="9.9" y1="6.6" x2="12" y2="8.7"/>' +
'<line x1="14.1" y1="6.6" x2="12" y2="8.7"/>' +
'<line x1="9.9" y1="17.4" x2="12" y2="15.3"/>' +
'<line x1="14.1" y1="17.4" x2="12" y2="15.3"/>' +
'<line x1="6.9" y1="10.4" x2="9.6" y2="11"/>' +
'<line x1="6.9" y1="13.6" x2="9.6" y2="13"/>' +
'<line x1="17.1" y1="10.4" x2="14.4" y2="11"/>' +
'<line x1="17.1" y1="13.6" x2="14.4" y2="13"/>' +
'</g></svg>';

const snowflakeIcon = L.divIcon({
    className: 'snowflake-icon',
    html: snowflakeSvg,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
});

// ==== Chiamata al proxy ====
function fetchTemperature(node) {
    const url = new URL(PROXY_URL);
    url.searchParams.set('node', node);

    const t0 = performance.now();
    logApi('<span class="label">Anfrage läuft…</span>\n' +
           '<span class="label">node:</span> ' + node);

    return fetch(url.toString())
    .then(r => {
        const ms = Math.round(performance.now() - t0);
        const cls = r.ok ? 'status-ok' : 'status-err';
        return r.text().then(body => {
            logApi(
                '<span class="' + cls + '">HTTP ' + r.status + ' ' + r.statusText +
                '</span>  <span class="label">(' + ms + ' ms)</span>\n' +
                '<span class="label">node:</span> ' + node + '\n' +
                '<span class="label">body:</span>\n' + body
            );
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return JSON.parse(body);
        });
    })
    .then(json => {
        const series = json.results && json.results[0] && json.results[0].series;
        if (!series || !series.length) return null;
        const s = series[0];
        const row = s.values[0];
        return {
            value: row[s.columns.indexOf('last')],
            time: row[s.columns.indexOf('time')]
        };
    })
    .catch(err => {
        const ms = Math.round(performance.now() - t0);
        logApi('<span class="status-err">FEHLER: ' + err.message +
               '</span>  <span class="label">(' + ms + ' ms)</span>\n' +
               '<span class="label">node:</span> ' + node);
        throw err;
    });
}

fetch('Routen_2627.geojson')
.then(response => response.json())
.then(data => {

    const bezirke = [...new Set(
        data.features.map(f => f.properties.unterhalt)
    )];

    // Alphabetische Reihenfolge, aber UB 10 und UB 12 immer am Ende
    bezirke.sort(function(a, b) {

        const aFondo = bezirkeInFondo.indexOf(a) !== -1;
        const bFondo = bezirkeInFondo.indexOf(b) !== -1;

        if (aFondo !== bFondo) {
            return aFondo ? 1 : -1;
        }

        if (aFondo && bFondo) {
            return bezirkeInFondo.indexOf(a) - bezirkeInFondo.indexOf(b);
        }

        return String(a).localeCompare(String(b), 'de');
    });

    // Jedem Bezirk eine Farbe zuweisen (zyklisch, falls mehr als 12)
    bezirke.forEach((b, i) => {
        bezirkColors[b] = palette[i % palette.length];
    });

    // Alle Routen anzeigen (unter Berücksichtigung des Bezirk-Filters)
    function showAllRoutes(fitView) {

        geojsonLayer.eachLayer(function(layer) {

            const bezirk = layer.feature.properties.unterhalt;

            if (currentBezirk === 'all' || bezirk === currentBezirk) {
                layer.addTo(map);
            } else {
                map.removeLayer(layer);
            }

        });

        geojsonLayer.resetStyle();
        selectedLayer = null;
        allRoutesVisible = true;

        if (fitView) {
            fitToVisible();
        }

        updateRouteLabels();
    }

    // Ansicht an die aktuell sichtbaren Routen anpassen
    function fitToVisible() {

        const bounds = L.latLngBounds([]);

        geojsonLayer.eachLayer(function(layer) {
            if (map.hasLayer(layer) && layer.getBounds) {
                bounds.extend(layer.getBounds());
            }
        });

        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    }

    // Eine Route isolieren und hervorheben (gleiche Logik wie Klick auf der Karte)
    function selectRoute(layer) {

        // Alle anderen Routen von der Karte entfernen
        geojsonLayer.eachLayer(function(other) {
            if (other !== layer) {
                map.removeLayer(other);
            }
        });

        layer.addTo(map);
        layer.setStyle({
            color: 'red',
            weight: 8
        });

        selectedLayer = layer;
        allRoutesVisible = false;

        map.fitBounds(layer.getBounds(), {
            padding: [50, 50],
            maxZoom: 16
        });

        renderLegend();
        updateRouteLabels();
    }

    // ---- Legende + Filter in einem einzigen Panel ----
    const legend = document.getElementById('legend');

    // Routenliste für einen bestimmten Bezirk
    function routesOfBezirk(bezirk) {

        const routes = [];

        geojsonLayer.eachLayer(function(layer) {
            if (layer.feature.properties.unterhalt === bezirk) {
                routes.push(layer);
            }
        });

        routes.sort(function(a, b) {
            return String(a.feature.properties.route)
                .localeCompare(String(b.feature.properties.route), 'de');
        });

        return routes;
    }

    function renderLegend() {

        let html = '<div class="legend-title">Unterhaltsbezirk</div>';

        html += '<div class="legend-item all' +
            (currentBezirk === 'all' ? ' active' : '') +
            '" data-bezirk="all">' +
            '<span class="swatch"></span>alle</div>';

        // Die Routen des aktiven Bezirks werden hier für den Klick gespeichert
        let activeRoutes = [];

        bezirke.forEach(b => {

            html += '<div class="legend-item' +
                (currentBezirk === b ? ' active' : '') +
                '" data-bezirk="' + b + '">' +
                '<span class="swatch" style="background:' +
                colorForBezirk(b) + '"></span>' +
                b + '</div>';

            // Untermenü: nur unter dem ausgewählten Bezirk
            if (currentBezirk === b) {

                activeRoutes = routesOfBezirk(b);

                html += '<div class="route-list">';

                activeRoutes.forEach(function(layer, i) {
                    html += '<div class="route-item' +
                        (selectedLayer === layer ? ' active' : '') +
                        '" data-route-index="' + i + '">' +
                        layer.feature.properties.route + '</div>';
                });

                html += '</div>';
            }
        });

        // Schalter für die Routenbeschriftung
        html += '<label class="label-toggle">' +
            '<input type="checkbox" id="label-toggle"' +
            (showRouteLabels ? ' checked' : '') + '>' +
            'Routenbeschriftung anzeigen</label>';

        // Schalter für die Strassenwetterstationen
        html += '<label class="label-toggle">' +
            '<input type="checkbox" id="sws-toggle"' +
            (showSws ? ' checked' : '') + '>' +
            'Strassenwetterstationen einblenden</label>';

        legend._routeLayers = activeRoutes;

        legend.innerHTML = html;

        // Klick auf die Bezirke
        legend.querySelectorAll('.legend-item').forEach(item => {
            item.addEventListener('click', function() {
                currentBezirk = this.dataset.bezirk;
                selectedLayer = null;
                renderLegend();
                showAllRoutes(true);
            });
        });

        // Klick auf die Routen im Untermenü
        legend.querySelectorAll('.route-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const layer = legend._routeLayers[
                    parseInt(this.dataset.routeIndex, 10)
                ];
                if (layer) {
                    selectRoute(layer);
                }
            });
        });

        // Schalter für die Beschriftung
        const toggle = legend.querySelector('#label-toggle');
        if (toggle) {
            toggle.addEventListener('change', function() {
                showRouteLabels = this.checked;
                updateRouteLabels();
            });
        }

        // Schalter für die Strassenwetterstationen
        const swsToggle = legend.querySelector('#sws-toggle');
        if (swsToggle) {
            swsToggle.addEventListener('change', function() {
                showSws = this.checked;
                updateSws();
            });
        }
    }

    geojsonLayer = L.geoJSON(data, {

        style: function(feature) {
            return {
                color: colorForBezirk(feature.properties.unterhalt),
                weight: 4,
                opacity: 0.9
            };
        },

        onEachFeature: function(feature, layer) {

            let popupContent = "";

            for (let key in feature.properties) {
                popupContent +=
                    "<b>" + key + "</b>: " +
                    feature.properties[key] +
                    "<br>";
            }

            layer.bindPopup(popupContent);

            // Dauerhafte Beschriftung mit properties.route, mittig auf der Route
            layer._routeLabel = L.tooltip({
                permanent: true,
                direction: 'center',
                className: 'route-label',
                interactive: false
            })
            .setContent(feature.properties.route)
            .setLatLng(layer.getBounds().getCenter());

            layer.on('click', function(e) {

                // Der Klick darf nicht bis zur Karte durchgereicht werden
                L.DomEvent.stopPropagation(e);

                // Klick auf dieselbe Route: zurück zur Gesamtansicht
                if (selectedLayer === layer) {
                    showAllRoutes(true);
                    renderLegend();
                    return;
                }

                selectRoute(layer);

            });
        }

    }).addTo(map);

    renderLegend();

    map.fitBounds(geojsonLayer.getBounds());

    // Klick auf eine beliebige Stelle der Karte: zurück zur Gesamtansicht
    map.on('click', function() {
        if (!allRoutesVisible) {
            showAllRoutes(true);
            renderLegend();
        }
    });

})
.catch(error => console.error(error));

fetch('UB_Grenzen.geojson')
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {
        style: {
            color: 'black',
            weight: 2,
            fillOpacity: 0
        }
    }).addTo(map);

})
.catch(error => console.error(error));

// --- Strassenwetterstationen: ein-/ausblenden ---
function updateSws() {
    if (!swsLayer) {
        return;
    }
    if (showSws) {
        swsLayer.addTo(map);
    } else {
        map.removeLayer(swsLayer);
    }
}

// --- Punti SWS (fiocchi di neve) con Temperatur ---
fetch('SWS_TBA.geojson')
.then(response => {
    if (!response.ok) {
        throw new Error('HTTP ' + response.status);
    }
    return response.json();
})
.then(data => {

    swsLayer = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {
            return L.marker(latlng, {
                icon: snowflakeIcon,
                riseOnHover: true
            });
        },

        onEachFeature: function(feature, layer) {

            const props = feature.properties;
            const node = props[NODE_PROPERTY] || '';

            let popup = "";
            for (let key in props) {
                popup += "<b>" + key + "</b>: " +
                         props[key] + "<br>";
            }
            popup += "<br><b>Temperatur:</b> <span class='temp'>lädt…</span>";
            layer.bindPopup(popup);

            layer.on('popupopen', function(e) {
                const el = e.popup.getElement().querySelector('.temp');
                if (!el) return;
                if (!node) {
                    el.textContent = 'kein SN-Decentlab';
                    logApi('<span class="status-err">kein SN-Decentlab in den Properties</span>');
                    return;
                }
                fetchTemperature(node)
                    .then(res => {
                        if (!res) { el.textContent = 'keine Daten'; return; }
                        el.textContent = res.value + ' °C';
                    })
                    .catch(err => {
                        console.error('API:', err);
                        el.textContent = 'Fehler';
                    });
            });
        }

    });

    // Standardmässig nicht auf der Karte
    updateSws();

})
.catch(error => console.error(error));

</script>

</body>
</html>
